<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6b1d2a">
<title>duitku — catatan keuangan</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5ebdd;--card:#fffaf2;--ink:#3a1219;--mute:#8a6a62;--mar:#6b1d2a;--mar2:#8e2b3d;--bei:#e8d5bb;--ok:#3f7d5a;--warn:#c47a1a;--bad:#b3261e;--sh:0 10px 30px rgba(107,29,42,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0d13;--card:#3a161e;--ink:#f5ebdd;--mute:#c4a79a;--mar:#b8465a;--mar2:#d0627a;--bei:#4d2630;--sh:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#2a0d13;--card:#3a161e;--ink:#f5ebdd;--mute:#c4a79a;--mar:#b8465a;--mar2:#d0627a;--bei:#4d2630;--sh:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow-x:hidden}
h1,h2,.serif{font-family:'Fraunces',Georgia,serif}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.35;z-index:0;animation:fl 12s ease-in-out infinite}
.b1{width:260px;height:260px;background:var(--mar2);top:-80px;right:-80px}
.b2{width:220px;height:220px;background:#d9b98a;bottom:60px;left:-90px;animation-delay:-5s}
@keyframes fl{50%{transform:translate(30px,40px) scale(1.15)}}
.s{position:fixed;z-index:0;pointer-events:none;animation:dr var(--d) ease-in-out infinite alternate}
.ring{border:5px solid var(--mar2);border-radius:50%;opacity:.22}
.dia{background:#d9b98a;border-radius:10px;opacity:.4;rotate:45deg}
.dots{background:radial-gradient(var(--mar2) 2.5px,transparent 3px) 0 0/13px 13px;opacity:.35}
.pil{border-radius:99px;background:var(--mar2);opacity:.14;height:20px}
.plus{color:var(--mar2);opacity:.3}
@keyframes dr{to{transform:translate(24px,-34px) rotate(50deg)}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:18px 16px 120px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top h1{margin:0;font-size:26px;color:var(--mar)}
.top small{color:var(--mute)}
.ibtn{border:0;background:var(--card);color:var(--mar);width:42px;height:42px;border-radius:50%;box-shadow:var(--sh);font-size:16px;cursor:pointer;margin-left:8px;transition:transform .3s}
.ibtn:active{transform:rotate(60deg) scale(.9)}
.view{display:none}.view.on{display:block;animation:up .5s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(20px)}}
.hero{background:linear-gradient(135deg,var(--mar),var(--mar2));color:#f5ebdd;border-radius:30px 30px 30px 8px;padding:24px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;border:30px solid rgba(245,235,221,.1);right:-50px;top:-50px;animation:spin 20s linear infinite}
.hero:before{content:"";position:absolute;width:90px;height:90px;right:30px;bottom:-10px;background:radial-gradient(rgba(245,235,221,.35) 2px,transparent 2.5px) 0 0/12px 12px}
.hero>*{position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.hero p{margin:0;opacity:.8;font-size:13px}
.bal{font-size:36px;margin:6px 0 16px}
.row{display:flex;gap:8px}
.pill{flex:1;background:rgba(245,235,221,.15);border-radius:18px;padding:10px;font-size:11px;backdrop-filter:blur(6px)}
.pill b{display:block;font-size:13px;margin-top:2px}
.card{background:var(--card);border-radius:26px;padding:18px;margin-top:14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.card:after{content:"";position:absolute;width:70px;height:70px;border-radius:50% 0 50% 50%;background:var(--bei);opacity:.55;right:-14px;top:-14px;pointer-events:none}
.card h2{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}
.card h2 i{color:var(--mar2);font-size:16px}
.bar{height:12px;background:var(--bei);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--ok),#8bc4a0);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar i.w{background:linear-gradient(90deg,var(--warn),#e8b25a)}.bar i.d{background:linear-gradient(90deg,var(--bad),#e57373)}.bar i.m{background:linear-gradient(90deg,var(--mar),var(--mar2))}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:8px;gap:8px}
.alert{margin-top:12px;padding:10px 12px;border-radius:14px;font-size:13px;font-weight:500;background:var(--bei);display:flex;gap:8px;align-items:center}
.alert.d{background:#f6d4d1;color:var(--bad);animation:shake .5s}
.alert.w{background:#f8e5c4;color:#7a4a05}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--bei);animation:up .4s both}
.item:last-child{border:0}
.ic{width:42px;height:42px;border-radius:14px 14px 14px 4px;background:var(--bei);color:var(--mar);display:grid;place-items:center;font-size:16px;flex:none}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-size:14px}.item .t small{color:var(--mute);font-size:11px}
.amt{font-weight:700;font-size:14px;white-space:nowrap}.in{color:var(--ok)}.out{color:var(--bad)}.sv{color:var(--mar2)}
.x{border:0;background:none;color:var(--mute);font-size:14px;cursor:pointer;padding:6px}
.empty{text-align:center;color:var(--mute);padding:24px 8px;font-size:13px}.empty i{display:block;font-size:26px;margin-bottom:8px;color:var(--mar2)}
.w-item{background:var(--card);border-radius:22px;padding:14px;margin-top:12px;box-shadow:var(--sh);animation:up .4s both}
.w-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;padding:4px 10px;border-radius:99px;background:var(--bei);font-weight:700;white-space:nowrap}
.tag.ok{background:var(--ok);color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.btn{border:0;border-radius:16px;padding:10px 14px;font:700 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;background:var(--mar);color:#f5ebdd;transition:transform .2s}
.btn:active{transform:scale(.94)}.btn.g{background:var(--bei);color:var(--ink)}.btn.full{width:100%;padding:14px}
.sum{background:var(--bei);border-radius:18px;padding:12px;font-size:13px;margin-top:10px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:4px;background:var(--card);padding:6px;border-radius:99px;box-shadow:0 12px 36px rgba(107,29,42,.25)}
nav button{border:0;background:none;color:var(--mute);font:600 12px 'Plus Jakarta Sans',sans-serif;padding:10px 15px;border-radius:99px;cursor:pointer;transition:.3s;display:flex;gap:6px;align-items:center}
nav button.on{background:var(--mar);color:#f5ebdd}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:5;width:58px;height:58px;border-radius:50% 50% 50% 14px;border:0;background:var(--mar);color:#f5ebdd;font-size:22px;box-shadow:0 10px 24px rgba(107,29,42,.4);cursor:pointer;transition:transform .3s;animation:bob 3s ease-in-out infinite}
.fab:active{transform:rotate(90deg) scale(.9)}
@keyframes bob{50%{transform:translateY(-5px)}}
.ov{position:fixed;inset:0;background:rgba(42,13,19,.55);z-index:10;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:30px 30px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:sl .4s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto}
@keyframes sl{from{transform:translateY(100%)}}
.sheet h2{margin:0 0 12px}.sheet label{font-size:12px;color:var(--mute);font-weight:700;display:block;margin:4px 0 6px}
.seg{display:flex;background:var(--bei);border-radius:16px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:10px 4px;border-radius:12px;font:700 12px 'Plus Jakarta Sans',sans-serif;color:var(--ink);cursor:pointer;transition:.3s}
.seg button.on{background:var(--mar);color:#f5ebdd}
input{width:100%;border:2px solid var(--bei);background:var(--bg);color:var(--ink);border-radius:16px;padding:13px;font:500 15px 'Plus Jakarta Sans',sans-serif;margin-bottom:10px;outline:0;transition:border .2s}
input:focus{border-color:var(--mar2)}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cats button{border:2px solid var(--bei);background:none;color:var(--ink);border-radius:99px;padding:7px 12px;font:600 12px 'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:.2s}
.cats button.on{background:var(--mar);border-color:var(--mar);color:#f5ebdd;transform:scale(1.05)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-150%);background:var(--mar);color:#f5ebdd;padding:12px 18px;border-radius:99px;z-index:20;font-size:13px;font-weight:600;transition:transform .5s cubic-bezier(.3,1.5,.5,1);max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.conf{position:fixed;top:-20px;z-index:30;color:var(--mar2);animation:fall 2s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.donut{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex:none}.donut>div{width:68%;height:68%;background:var(--card);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center}.donut small{color:var(--mute);font-size:10px}
.lg{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}.lg i{width:10px;height:10px;border-radius:3px;flex:none}.lg span{flex:1}
select{flex:1;min-width:0;border:2px solid var(--bei);background:var(--bg);color:var(--ink);border-radius:16px;padding:13px;font:500 14px 'Plus Jakarta Sans',sans-serif;margin-bottom:10px}
.card h2 button{position:relative;z-index:2}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<main>
<div class="top"><div><h1>duitku</h1><small id="hi"></small></div><div><button class="ibtn" id="gear" aria-label="pengaturan"><i class="fa-solid fa-sliders"></i></button><button class="ibtn" id="theme" aria-label="tema"><i class="fa-solid fa-moon"></i></button></div></div>

<section class="view on" id="v-home">
<div class="hero"><p>Saldo kamu sekarang</p><div class="bal serif" id="bal">Rp0</div>
<div class="row"><div class="pill"><i class="fa-solid fa-arrow-down"></i> Masuk<b id="inn">Rp0</b></div><div class="pill"><i class="fa-solid fa-arrow-up"></i> Keluar<b id="outt">Rp0</b></div><div class="pill"><i class="fa-solid fa-piggy-bank"></i> Tabungan<b id="svt">Rp0</b></div></div></div>
<div class="card"><h2><i class="fa-solid fa-seedling"></i>Target nabung bulan ini</h2>
<div class="bar"><i class="m" id="sb"></i></div>
<div class="meta"><span id="st">Belum diatur</span></div><div id="sal"></div></div>
<div class="card"><h2><i class="fa-solid fa-gauge-high"></i>Budget bulan ini</h2>
<div class="bar"><i id="bb"></i></div>
<div class="meta"><span id="bt">Belum diatur</span></div><div id="al"></div></div>
<div class="card" id="streak" style="font-size:14px;line-height:1.6"></div>
<div class="card"><h2><i class="fa-solid fa-chart-pie"></i>Pengeluaran per kategori</h2><div id="chart"></div></div>
<div class="card"><h2><i class="fa-solid fa-bullseye"></i>Target tabungan<button class="ibtn" id="addg" style="margin-left:auto;width:34px;height:34px"><i class="fa-solid fa-plus"></i></button></h2><div id="goals"></div></div>
<div class="card"><h2><i class="fa-solid fa-handshake"></i>Utang &amp; piutang<button class="ibtn" id="addd" style="margin-left:auto;width:34px;height:34px"><i class="fa-solid fa-plus"></i></button></h2><div id="debts"></div></div>
<div class="card"><h2><i class="fa-solid fa-clock-rotate-left"></i>Terbaru</h2><div id="rec"></div></div>
</section>

<section class="view" id="v-wish">
<div class="card" style="margin-top:0"><h2><i class="fa-solid fa-heart"></i>Wishlist</h2><div class="sum" id="can"></div></div>
<div id="wl"></div>
</section>

<section class="view" id="v-hist"><div class="card" style="margin-top:0"><h2><i class="fa-solid fa-receipt"></i>Semua riwayat</h2><input id="q" placeholder="Cari catatan..."><div style="display:flex;gap:8px"><select id="fc"></select><input type="month" id="fm" style="min-width:0"></div><div id="all"></div></div></section>
</main>

<button class="fab" id="fab" aria-label="tambah"><i class="fa-solid fa-plus"></i></button>
<nav><button data-v="home" class="on"><i class="fa-solid fa-house"></i>Beranda</button><button data-v="wish"><i class="fa-solid fa-heart"></i>Wishlist</button><button data-v="hist"><i class="fa-solid fa-receipt"></i>Riwayat</button></nav>
<div class="ov" id="ov"><div class="sheet" id="sh"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const I=(c,x='')=>`<i class="fa-solid fa-${c} ${x}"></i>`;
const CO={'Makan':'utensils','Transport':'motorcycle','Jajan':'mug-hot','Belanja':'bag-shopping','Tagihan':'bolt','Hiburan':'gamepad','Lainnya':'wand-magic-sparkles'};
const CI={'Uang Saku':'envelope-open-text','Gaji':'briefcase','Freelance':'laptop-code','Bonus':'gift'};
let S={tx:[],wish:[],limit:0,pct:20};
try{const r=localStorage.getItem('duitku');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('duitku',JSON.stringify(S))}catch(e){}};
const mk=d=>{const x=new Date(d);return x.getFullYear()+'-'+x.getMonth()};
const sum=(a,ty)=>a.filter(t=>t.type===ty).reduce((s,t)=>s+t.amt,0);
const saldo=()=>sum(S.tx,'in')-sum(S.tx,'out')-sum(S.tx,'sv');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseInt(String(v).replace(/\D/g,''))||0;
// shapes
['ring','dia','dots','pil','plus','ring','dots','dia','pil','plus'].forEach((t,i)=>{const e=document.createElement('div'),z=22+Math.random()*50;e.className='s '+t;e.style.cssText=`left:${Math.random()*92}vw;top:${Math.random()*88}vh;width:${t==='pil'?z*2:z}px;height:${t==='pil'?20:z}px;--d:${7+Math.random()*8}s;animation-delay:-${Math.random()*6}s`;if(t==='plus'){e.innerHTML=I('plus');e.style.fontSize=z/1.5+'px';e.style.width=e.style.height='auto'}document.body.prepend(e)});
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3400)}
function confetti(){const e=['star','heart','leaf','seedling','gem'];for(let i=0;i<26;i++){const c=document.createElement('i');c.className='conf fa-solid fa-'+e[i%5];c.style.left=Math.random()*100+'vw';c.style.fontSize=12+Math.random()*14+'px';c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3000)}}
let shown=0;
function count(el,to){const from=shown,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/800);el.textContent=rp(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f);else shown=to})(t0)}
function itemHTML(t,i,del){const ic=t.type==='in'?CI[t.cat]||'coins':t.type==='sv'?'piggy-bank':CO[t.cat]||'star',sg={in:'+',out:'-',sv:'→'}[t.type];
return `<div class="item" style="animation-delay:${i*.05}s"><div class="ic">${I(ic)}</div><div class="t"><b>${esc(t.note||t.cat)}</b><small>${t.cat} · ${new Date(t.d).toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</small></div><span class="amt ${t.type}">${sg}${rp(t.amt)}</span>${del?`<button class="x" data-del="${t.id}">${I('xmark')}</button>`:''}</div>`}
const al=(c,ic,m)=>`<div class="alert ${c}">${I(ic)}<span>${m}</span></div>`;
function render(){
const h=new Date().getHours();$('#hi').textContent=(h<11?'Pagi':h<15?'Siang':h<18?'Sore':'Malam')+' bestie, yuk atur duitnya';
const sd=saldo(),m=mk(Date.now()),mt=S.tx.filter(t=>mk(t.d)===m);
count($('#bal'),sd);
const inc=sum(mt,'in'),spent=sum(mt,'out'),sv=sum(mt,'sv');
$('#inn').textContent=rp(inc);$('#outt').textContent=rp(spent);$('#svt').textContent=rp(sum(S.tx,'sv'));
// savings
const tg=Math.ceil(inc*S.pct/100),sb=$('#sb'),sa=$('#sal');
if(S.pct>0&&inc>0){const p=tg?sv/tg*100:0;sb.style.width=Math.min(100,p)+'%';
$('#st').textContent=`${rp(sv)} / ${rp(tg)} (min ${S.pct}% dari pemasukan)`;
sa.innerHTML=sv>=tg?al('','circle-check','Target nabung tercapai, keren!'):al('w','triangle-exclamation',`Sisihkan ${rp(tg-sv)} lagi biar nabungmu genap ${S.pct}%`)}
else{sb.style.width='0';$('#st').textContent=S.pct>0?`Min ${S.pct}% dari tiap pemasukan — catat pemasukan dulu`:'Belum diatur';sa.innerHTML=''}
// budget
const bb=$('#bb'),a=$('#al');
if(S.limit>0){const p=spent/S.limit*100;bb.style.width=Math.min(100,p)+'%';bb.className=p>=100?'d':p>=80?'w':'';
$('#bt').textContent=`${rp(spent)} / ${rp(S.limit)} (${Math.round(p)}%)`;
a.innerHTML=p>=100?al('d','circle-exclamation',`Over budget ${rp(spent-S.limit)}! Stop jajan dulu yaa`):p>=80?al('w','triangle-exclamation',`Hati-hati, budget tinggal ${rp(S.limit-spent)}`):al('','circle-check',`Aman, sisa budget ${rp(S.limit-spent)}`)}
else{bb.style.width='0';$('#bt').textContent='Belum diatur';a.innerHTML=''}
const L=[...S.tx].sort((x,y)=>y.d-x.d),em=`<div class="empty">${I('seedling')}Belum ada catatan<br>Tekan + untuk mulai</div>`;
$('#rec').innerHTML=L.length?L.slice(0,5).map((t,i)=>itemHTML(t,i)).join(''):em;
$('#all').innerHTML=L.length?L.map((t,i)=>itemHTML(t,Math.min(i,10),1)).join(''):em;
// wishlist
const W=[...S.wish].sort((x,y)=>x.price-y.price);let left=sd;const buy=[];W.forEach(w=>{if(left>=w.price){left-=w.price;buy.push(w.name)}});
$('#can').innerHTML=W.length?(buy.length?`Dengan saldo ${rp(sd)}, kamu bisa beli: <b>${buy.map(esc).join(', ')}</b>. Sisa ${rp(left)}`:`Saldo ${rp(sd)} belum cukup buat wishlist apa pun. Semangat nabung!`):'Tambah wishlist pertamamu pakai tombol +';
$('#wl').innerHTML=W.map((w,i)=>{const p=Math.max(0,Math.min(100,sd/w.price*100)),ok=sd>=w.price;
return `<div class="w-item" style="animation-delay:${i*.06}s"><div class="w-top"><b>${esc(w.name)}</b><span class="tag ${ok?'ok':''}">${ok?I('check')+' Cukup!':Math.floor(p)+'%'}</span></div>
<div class="meta" style="margin:4px 0 8px"><span>${rp(w.price)}</span><span>${ok?'':'kurang '+rp(w.price-sd)}</span></div>
<div class="bar"><i class="${ok?'':'w'}" style="width:${p}%"></i></div>
<div style="display:flex;gap:8px;margin-top:10px">${ok?`<button class="btn" data-buy="${w.id}">${I('bag-shopping')} Beli sekarang</button>`:''}<button class="btn g" data-wdel="${w.id}">${I('trash')} Hapus</button></div></div>`}).join('');
}
function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#fab').dataset.mode=v==='wish'?'wish':'tx';window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
const open=h=>{$('#sh').innerHTML=h;$('#ov').classList.add('on')};
const close=()=>$('#ov').classList.remove('on');
$('#ov').onclick=e=>{if(e.target.id==='ov')close()};
const fmtIn=el=>{el.oninput=()=>{const n=num(el.value);el.value=n?n.toLocaleString('id-ID'):''}};
function txSheet(){let type='out',cat='Makan';
open(`<h2>Catat transaksi</h2><div class="seg"><button data-t="out" class="on">Pengeluaran</button><button data-t="in">Pemasukan</button><button data-t="sv">Tabungan</button></div>
<input id="a" inputmode="numeric" placeholder="Nominal (Rp)"><input id="n" placeholder="Catatan (opsional)"><div class="cats" id="c"></div><button class="btn full" id="ok">Simpan</button>`);
fmtIn($('#a'));
const cats=()=>{if(type==='sv'){$('#c').innerHTML='';return}const M=type==='out'?CO:CI,o=Object.keys(M);if(!o.includes(cat))cat=o[0];$('#c').innerHTML=o.map(k=>`<button class="${k===cat?'on':''}" data-c="${k}">${I(M[k])} ${k}</button>`).join('')};cats();
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{type=b.dataset.t;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));cats()});
$('#c').onclick=e=>{const b=e.target.closest('[data-c]');if(b){cat=b.dataset.c;cats()}};
$('#ok').onclick=()=>{const amt=num($('#a').value);if(!amt){$('#a').focus();return}
const m=mk(Date.now()),before=sum(S.tx.filter(t=>mk(t.d)===m),'out');
if(type==='sv'&&amt>saldo()){toast('Saldo kamu belum cukup buat nabung segitu');return}
S.tx.push({id:Date.now(),type,cat:type==='sv'?'Tabungan':cat,amt,note:$('#n').value.trim(),d:Date.now()});save();close();render();
if(type==='out'&&S.limit>0){const x=before+amt;if(x>S.limit)toast('Kamu over budget '+rp(x-S.limit)+'!');else if(x>=S.limit*.8&&before<S.limit*.8)toast('Pengeluaran sudah 80% dari budget')}
else if(type==='in'&&S.pct>0)toast(`Sisihkan minimal ${rp(amt*S.pct/100)} (${S.pct}%) buat nabung ya!`);
else toast('Tercatat')}}
function wishSheet(){open(`<h2>Tambah wishlist</h2><input id="a" placeholder="Nama barang (mis. Sepatu)"><input id="p" inputmode="numeric" placeholder="Harga (Rp)"><button class="btn full" id="ok">Tambah</button>`);
fmtIn($('#p'));$('#ok').onclick=()=>{const name=$('#a').value.trim(),price=num($('#p').value);if(!name||!price)return;S.wish.push({id:Date.now(),name,price});save();close();render();toast('Masuk wishlist')}}
$('#fab').onclick=()=>$('#fab').dataset.mode==='wish'?wishSheet():txSheet();
$('#gear').onclick=()=>{open(`<h2>Pengaturan</h2><label>Batas pengeluaran per bulan (Rp)</label><input id="a" inputmode="numeric" placeholder="mis. 1.500.000" value="${S.limit?S.limit.toLocaleString('id-ID'):''}"><label>Minimal nabung dari pemasukan (%)</label><input id="p" inputmode="numeric" placeholder="mis. 20" value="${S.pct||''}"><button class="btn full" id="ok">Simpan</button>`);fmtIn($('#a'));$('#ok').onclick=()=>{S.limit=num($('#a').value);S.pct=Math.min(100,num($('#p').value));save();close();render();toast('Pengaturan disimpan')}};
document.body.addEventListener('click',e=>{const d=e.target.closest('[data-del]'),w=e.target.closest('[data-wdel]'),b=e.target.closest('[data-buy]');
if(d){S.tx=S.tx.filter(t=>t.id!=d.dataset.del);save();render()}
if(w){S.wish=S.wish.filter(t=>t.id!=w.dataset.wdel);save();render()}
if(b){const it=S.wish.find(t=>t.id==b.dataset.buy);if(it){S.tx.push({id:Date.now(),type:'out',cat:'Belanja',amt:it.price,note:it.name,d:Date.now()});S.wish=S.wish.filter(t=>t!==it);save();render();confetti();toast('Yeay, '+it.name+' kebeli!')}}});
$('#theme').onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';$('#theme').innerHTML=I(dk?'moon':'sun')};
render();
</script>
<script>
const PAL=['#6b1d2a','#b8465a','#d9b98a','#8e2b3d','#c4a79a','#e8b25a','#a05a4a'];
S.goals=S.goals||[];S.debt=S.debt||[];S.rec=S.rec||[];S.cl=S.cl||{};
const ym=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};
const _r=render;render=function(){_r();extra()};
function applyRec(){const n=new Date(),m=mk(n);let c=0;S.rec.forEach(r=>{if(r.last!==m&&n.getDate()>=r.day){S.tx.push({id:Date.now()+Math.random(),type:r.type,cat:r.cat,amt:r.amt,note:r.note,d:new Date(n.getFullYear(),n.getMonth(),r.day).getTime()});r.last=m;c=1}});if(c)save()}
function extra(){
const m=mk(Date.now()),by={};S.tx.filter(t=>mk(t.d)===m&&t.type==='out').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
const tot=Object.values(by).reduce((a,b)=>a+b,0),ks=Object.keys(by).sort((a,b)=>by[b]-by[a]);let a=0;
const g=ks.map((k,i)=>{const p=by[k]/tot*100,s=`${PAL[i%7]} ${a}% ${a+p}%`;a+=p;return s}).join(',');
$('#chart').innerHTML=tot?`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="donut" style="background:conic-gradient(${g})"><div><b>${rp(tot)}</b><small>bulan ini</small></div></div><div style="flex:1;min-width:150px">${ks.map((k,i)=>{const l=S.cl[k],o=l&&by[k]>l;return `<div class="lg"><i style="background:${PAL[i%7]}"></i><span>${k}</span><b class="${o?'out':''}">${rp(by[k])}${l?' / '+rp(l):''}</b></div>`}).join('')}</div></div>`+ks.filter(k=>S.cl[k]&&by[k]>S.cl[k]).map(k=>al('d','circle-exclamation',`Budget ${k} over ${rp(by[k]-S.cl[k])}`)).join(''):`<div class="empty">${I('chart-pie')}Belum ada pengeluaran bulan ini</div>`;
let st=0;if(S.limit>0&&S.tx.length){const f=Math.min(...S.tx.map(t=>t.d)),lim=S.limit/30;for(let i=0;i<365;i++){const d=new Date();d.setDate(d.getDate()-i);if(d.getTime()<f-864e5)break;const sp=S.tx.filter(t=>t.type==='out'&&new Date(t.d).toDateString()===d.toDateString()).reduce((s,t)=>s+t.amt,0);if(sp>lim)break;st++}}
$('#streak').innerHTML=S.limit>0?`${I('fire','out')} <b>${st} hari</b> hemat berturut-turut${st>=30?' · Sultan hemat':st>=7?' · Pejuang hemat':''}<br><small style="color:var(--mute)">hemat = pengeluaran harian ≤ budget ÷ 30</small>`:`${I('fire')} Atur budget bulanan dulu buat mulai streak hemat`;
$('#goals').innerHTML=S.goals.map(g=>{const sv=S.tx.filter(t=>t.g===g.id).reduce((s,t)=>s+t.amt,0),p=Math.min(100,sv/g.target*100);return `<div style="margin-bottom:14px"><div class="w-top"><b>${esc(g.name)}</b><span class="tag ${p>=100?'ok':''}">${Math.floor(p)}%</span></div><div class="meta" style="margin:4px 0 8px"><span>${rp(sv)} / ${rp(g.target)}</span></div><div class="bar"><i class="m" style="width:${p}%"></i></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" data-gs="${g.id}">${I('piggy-bank')} Nabung</button><button class="btn g" data-gd="${g.id}">${I('trash')}</button></div></div>`}).join('')||`<div class="empty">Belum ada target tabungan</div>`;
$('#debts').innerHTML=S.debt.map(d=>`<div class="item"><div class="ic">${I(d.me?'hand-holding-dollar':'hand-holding-heart')}</div><div class="t"><b>${esc(d.name)}</b><small>${d.me?'Aku utang':'Dia utang'}${d.done?' · lunas':''}</small></div><span class="amt ${d.me?'out':'in'}" style="${d.done?'text-decoration:line-through;opacity:.5':''}">${rp(d.amt)}</span><button class="x" data-dp="${d.id}">${I(d.done?'rotate-left':'check')}</button><button class="x" data-dx="${d.id}">${I('xmark')}</button></div>`).join('')||`<div class="empty">Tidak ada utang piutang</div>`;
const ms=new Set(S.tx.map(t=>mk(t.d))).size||1,net=(sum(S.tx,'in')-sum(S.tx,'out'))/ms,sd=saldo();
[...S.wish].sort((x,y)=>x.price-y.price).forEach((w,i)=>{const e=document.querySelectorAll('.w-item .meta')[i];if(e&&sd<w.price)e.insertAdjacentHTML('beforeend',net>0?`<span>~${Math.ceil((w.price-sd)/net)} bln lagi</span>`:'<span>belum ada surplus</span>')});
const q=$('#q').value.toLowerCase(),fc=$('#fc').value,fm=$('#fm').value;
const L=[...S.tx].sort((x,y)=>y.d-x.d).filter(t=>(!fc||t.cat===fc)&&(!fm||ym(t.d)===fm)&&(!q||(t.note+t.cat).toLowerCase().includes(q)));
$('#all').innerHTML=L.length?L.map((t,i)=>itemHTML(t,Math.min(i,10),1)).join(''):`<div class="empty">Tidak ada hasil</div>`}
$('#fc').innerHTML='<option value="">Semua kategori</option>'+[...Object.keys(CO),...Object.keys(CI),'Tabungan'].map(k=>`<option>${k}</option>`).join('');
['q','fc','fm'].forEach(i=>$('#'+i).oninput=extra);
$('#addg').onclick=()=>{open(`<h2>Target tabungan</h2><input id="a" placeholder="Nama (mis. Dana darurat)"><input id="p" inputmode="numeric" placeholder="Target (Rp)"><button class="btn full" id="ok">Buat</button>`);fmtIn($('#p'));$('#ok').onclick=()=>{const name=$('#a').value.trim(),target=num($('#p').value);if(!name||!target)return;S.goals.push({id:Date.now(),name,target});save();close();render()}};
$('#addd').onclick=()=>{let me=1;open(`<h2>Utang / piutang</h2><div class="seg"><button class="on" data-m="1">Aku utang</button><button data-m="0">Dia utang</button></div><input id="a" placeholder="Nama orang"><input id="p" inputmode="numeric" placeholder="Nominal (Rp)"><button class="btn full" id="ok">Simpan</button>`);fmtIn($('#p'));document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{me=+b.dataset.m;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b))});$('#ok').onclick=()=>{const name=$('#a').value.trim(),amt=num($('#p').value);if(!name||!amt)return;S.debt.push({id:Date.now(),name,amt,me:!!me});save();close();render()}};
function recSheet(){let type='out';open(`<h2>Transaksi rutin</h2>${S.rec.map(r=>`<div class="item"><div class="t"><b>${esc(r.note)}</b><small>tiap tgl ${r.day} · ${r.type==='in'?'masuk':'keluar'}</small></div><span class="amt ${r.type}">${rp(r.amt)}</span><button class="x" data-rx="${r.id}">${I('xmark')}</button></div>`).join('')}<div class="seg" style="margin-top:12px"><button class="on" data-t="out">Keluar</button><button data-t="in">Masuk</button></div><input id="a" placeholder="Nama (mis. Spotify)"><input id="p" inputmode="numeric" placeholder="Nominal (Rp)"><input id="d" inputmode="numeric" placeholder="Tanggal tiap bulan (1-28)"><button class="btn full" id="ok">Tambah rutin</button>`);fmtIn($('#p'));
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{type=b.dataset.t;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b))});
$('#ok').onclick=()=>{const note=$('#a').value.trim(),amt=num($('#p').value),day=Math.min(28,num($('#d').value)||1);if(!note||!amt)return;S.rec.push({id:Date.now(),type,cat:type==='in'?'Gaji':'Tagihan',amt,note,day,last:''});save();applyRec();close();render();toast('Transaksi rutin ditambahkan')}}
$('#gear').onclick=()=>{open(`<h2>Pengaturan</h2><label>Batas pengeluaran per bulan (Rp)</label><input id="a" inputmode="numeric" value="${S.limit?S.limit.toLocaleString('id-ID'):''}"><label>Minimal nabung dari pemasukan (%)</label><input id="p" inputmode="numeric" value="${S.pct||''}"><label>Budget per kategori (opsional)</label>${Object.keys(CO).map(k=>`<input data-cl="${k}" inputmode="numeric" placeholder="${k}" value="${S.cl[k]?S.cl[k].toLocaleString('id-ID'):''}">`).join('')}<button class="btn full" id="ok">Simpan</button><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn g" id="rb">${I('repeat')} Rutin</button><button class="btn g" id="ex">${I('download')} Backup</button><button class="btn g" id="im">${I('upload')} Restore</button></div><input type="file" id="fl" accept=".json" hidden>`);
document.querySelectorAll('.sheet input[inputmode]').forEach(fmtIn);
$('#ok').onclick=()=>{S.limit=num($('#a').value);S.pct=Math.min(100,num($('#p').value));document.querySelectorAll('[data-cl]').forEach(i=>{const v=num(i.value);if(v)S.cl[i.dataset.cl]=v;else delete S.cl[i.dataset.cl]});save();close();render();toast('Pengaturan disimpan')};
$('#rb').onclick=recSheet;
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='duitku-backup-'+ym(Date.now())+'.json';a.click();toast('Backup diunduh')};
$('#im').onclick=()=>$('#fl').click();
$('#fl').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;S=Object.assign({tx:[],wish:[],limit:0,pct:20,goals:[],debt:[],rec:[],cl:{}},d);save();close();render();toast('Data berhasil dipulihkan')}catch(x){toast('File backup tidak valid')}};r.readAsText(f)}};
document.body.addEventListener('click',e=>{const c=s=>e.target.closest(s);let b;
if(b=c('[data-gs]')){const g=S.goals.find(x=>x.id==b.dataset.gs);open(`<h2>Nabung: ${esc(g.name)}</h2><input id="a" inputmode="numeric" placeholder="Nominal (Rp)"><button class="btn full" id="ok">Simpan</button>`);fmtIn($('#a'));$('#ok').onclick=()=>{const amt=num($('#a').value);if(!amt)return;if(amt>saldo()){toast('Saldo belum cukup');return}S.tx.push({id:Date.now(),type:'sv',cat:'Tabungan',amt,note:g.name,g:g.id,d:Date.now()});save();close();render();toast('Masuk ke '+g.name)}}
if(b=c('[data-gd]')){S.goals=S.goals.filter(x=>x.id!=b.dataset.gd);save();render()}
if(b=c('[data-dp]')){const d=S.debt.find(x=>x.id==b.dataset.dp);d.done=!d.done;save();render()}
if(b=c('[data-dx]')){S.debt=S.debt.filter(x=>x.id!=b.dataset.dx);save();render()}
if(b=c('[data-rx]')){S.rec=S.rec.filter(x=>x.id!=b.dataset.rx);save();recSheet()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
applyRec();render();
</script>
</body>
</html>
